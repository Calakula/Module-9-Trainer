<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Module 9 Trainer</title>
<style>
:root{--bg:#f2f4fb;--cd:#fff;--tx:#1b1f33;--mu:#6b7194;--ac:#6c5ce7;--ok:#16a34a;--bd:#dc2626;--ln:#dfe3f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--cd:#1c1f3d;--tx:#eef0ff;--mu:#9aa0c9;--ac:#8b7dff;--ok:#34d399;--bd:#f87171;--ln:#2d3160;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:18px 16px 8px;max-width:820px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px;background:linear-gradient(90deg,var(--ac),#e84393);-webkit-background-clip:text;background-clip:text;color:transparent}
header small{color:var(--mu);display:block}
.lg button{padding:6px 10px;font-size:13px}
nav{max-width:820px;margin:auto;padding:6px 16px;display:flex;gap:8px;overflow-x:auto}
main{max-width:820px;margin:auto;padding:12px 16px 40px}
button{font:inherit;border:1px solid var(--ln);background:var(--cd);color:var(--tx);padding:10px 14px;border-radius:12px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--ac)}button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
nav button{white-space:nowrap}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 6px 20px #0001}

.mu{color:var(--mu);font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row button{flex:1}
.fc{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:20px;cursor:pointer;background:linear-gradient(135deg,var(--cd),var(--bg));border:2px solid var(--ac);border-radius:22px;padding:22px;margin:12px 0}
.fc.f{border-color:var(--ok)}
.op{display:block;width:100%;text-align:left;margin:8px 0}.op.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.op.bad{background:var(--bd);color:#fff;border-color:var(--bd)}.op.sel{border-color:var(--ac);border-width:2px}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols button{width:100%;margin-bottom:8px;font-size:14px}
.big{font-size:44px;text-align:center;margin:8px}
</style></head><body>

<script>
const UI={en:{ti:"Module 9 Trainer",su:"Virtualization and Cloud Computing",theory:"Theory",cards:"Flashcards",test:"Test",match:"Match",blitz:"Blitz",mist:"Mistakes",know:"I know it",again:"Again",hint:"Tap the card to flip",next:"Next",check:"Check",restart:"Restart",left:"Left",choose:"Choose several answers, then press Check",done:"All cards learned!",empty:"No mistakes yet. Take the test first!",tr:"True",fl:"False",pairs:"Connect each term with its definition",err:"Errors",note:"Questions stay in English, like on the real exam.",res:"Result",retry:"Review mistakes",time:"Time",blz:"True or false? You have 60 seconds.",go:"Go again",q:"Question",ok:"✔ Correct",ans:"Answer"},
ru:{ti:"Тренажёр: Модуль 9",su:"Виртуализация и облачные вычисления",theory:"Теория",cards:"Карточки",test:"Тест",match:"Пары",blitz:"Блиц",mist:"Ошибки",know:"Знаю",again:"Ещё раз",hint:"Нажми на карточку, чтобы перевернуть",next:"Дальше",check:"Проверить",restart:"Заново",left:"Осталось",choose:"Выбери несколько ответов и нажми «Проверить»",done:"Все карточки выучены!",empty:"Ошибок пока нет. Сначала пройди тест!",tr:"Верно",fl:"Неверно",pairs:"Соедини термин с определением",err:"Ошибки",note:"Вопросы остаются на английском, как на реальном экзамене.",res:"Результат",retry:"Повторить ошибки",time:"Время",blz:"Верно или нет? У тебя 60 секунд.",go:"Ещё раз",q:"Вопрос",ok:"✔ Верно",ans:"Ответ"},
kk:{ti:"Жаттықтырғыш: 9-модуль",su:"Виртуализация және бұлттық есептеулер",theory:"Теория",cards:"Карточкалар",test:"Тест",match:"Жұптар",blitz:"Блиц",mist:"Қателер",know:"Білемін",again:"Қайта",hint:"Аудару үшін карточканы бас",next:"Келесі",check:"Тексеру",restart:"Басынан",left:"Қалды",choose:"Бірнеше жауап таңдап, «Тексеру» түймесін бас",done:"Барлық карточка жатталды!",empty:"Әзірге қате жоқ. Алдымен тестті тапсыр!",tr:"Дұрыс",fl:"Қате",pairs:"Терминді анықтамасымен қос",err:"Қате",note:"Сұрақтар нақты емтихандағыдай ағылшынша қалады.",res:"Нәтиже",retry:"Қателерді қайталау",time:"Уақыт",blz:"Дұрыс па, жоқ па? 60 секундың бар.",go:"Қайта",q:"Сұрақ",ok:"✔ Дұрыс",ans:"Жауап"}};
const TH={en:[["Virtualization",["Software that separates the OS and apps from the physical hardware: one physical server runs many virtual machines (VMs).","Benefits: smaller physical footprint, less power and air conditioning, fewer servers.","VMs are isolated, so viruses and worms can be studied safely without risking the real network.","Run an app not supported by your OS by creating a VM with a suitable OS.","Live migration moves running VMs between hosts, which helps disaster recovery."]],["Hypervisor",["Main function: create and manage multiple VM instances on a host machine.","Type 1 (bare metal): installs directly on hardware, direct access to server resources, used in data centers and enterprises, needs management console.","Type 2 (hosted): runs on top of a host OS (e.g. Windows VM on a Mac laptop), no management console needed."]],["Cloud computing",["Lets users access data and apps anywhere, any time, from any device over the Internet.","On demand: pay only for what you use, scale capacity up and down, no in-house servers to buy.","Cloud separates the application from the hardware; virtualization separates the OS from the hardware.","They are NOT the same thing: virtualization is a technology that clouds are built on."]],["Service models",["SaaS: ready-to-use software, no technical maintenance (best when you lack technical knowledge).","PaaS: development platform and tools, e.g. developers worldwide share one environment.","IaaS: virtual servers, storage and networks. ITaaS: IT delivered as a service."]],["Cloud types",["Public: for the general population.","Private: for one specific organization or entity, such as government.","Community: built for a specific shared need (e.g. an international association).","Hybrid: two or more clouds connected through a single architecture."]],["Related technologies",["SDN (software-defined networking): automatically and quickly reconfigures network topologies.","VDI (virtual desktop infrastructure): uniform hands-on desktops for remote learners.","Virtual application streaming and hosted solutions such as Office 365 deliver apps from the cloud."]]],
ru:[["Виртуализация",["ПО, отделяющее ОС и приложения от физического оборудования: один физический сервер запускает много виртуальных машин (ВМ).","Плюсы: меньше места, меньше электричества и кондиционирования, меньше серверов.","ВМ изолированы, поэтому вирусы и черви можно изучать безопасно, не рискуя реальной сетью.","Приложение, не поддерживаемое вашей ОС, запускают в ВМ с подходящей ОС.","Живая миграция переносит работающие ВМ между хостами и помогает при аварийном восстановлении."]],["Гипервизор",["Главная функция: создавать и управлять несколькими ВМ на хост-машине.","Тип 1 (bare metal): ставится прямо на железо, прямой доступ к ресурсам сервера, для дата-центров и предприятий, нужна консоль управления.","Тип 2 (hosted): работает поверх основной ОС (например, Windows в ВМ на ноутбуке с Mac), консоль управления не нужна."]],["Облачные вычисления",["Доступ к данным и приложениям где и когда угодно, с любого устройства через Интернет.","По требованию: платишь только за использованное, мощности можно увеличивать и уменьшать, свои серверы покупать не нужно.","Облако отделяет приложение от оборудования; виртуализация отделяет ОС от оборудования.","Это НЕ одно и то же: виртуализация — технология, на которой строятся облака."]],["Модели услуг",["SaaS: готовое ПО без технического обслуживания (лучший выбор без техзнаний).","PaaS: платформа и инструменты разработки, например общая среда для разработчиков по всему миру.","IaaS: виртуальные серверы, хранилище и сети. ITaaS: ИТ как услуга."]],["Типы облаков",["Публичное: для широкой публики.","Частное: для одной организации, например государства.","Общественное (community): для общей специфической задачи (например, международная ассоциация).","Гибридное: два и более облака в единой архитектуре."]],["Связанные технологии",["SDN (программно-определяемые сети): автоматически и быстро перестраивают топологию сети.","VDI (инфраструктура виртуальных рабочих столов): единая практическая среда для удалённых учеников.","Потоковая передача приложений и решения вроде Office 365 доставляют приложения из облака."]]],
kk:[["Виртуализация",["ОЖ мен қолданбаларды физикалық жабдықтан бөлетін бағдарлама: бір физикалық сервер көп виртуалды машинаны (ВМ) жұмыс істетеді.","Артықшылығы: орын аз, электр және кондиционер аз, сервер аз.","ВМ оқшауланған, сондықтан вирустар мен құрттарды нақты желіге қауіп төндірмей қауіпсіз зерттеуге болады.","ОЖ қолдамайтын қолданбаны сәйкес ОЖ бар ВМ-де іске қосады.","Live migration жұмыс істеп тұрған ВМ-ді хосттар арасында жылжытады, апаттан кейін қалпына келтіруге көмектеседі."]],["Гипервизор",["Басты қызметі: хост-машинада бірнеше ВМ құру және басқару.","1-тип (bare metal): тікелей жабдыққа орнатылады, сервер ресурстарына тікелей қол жеткізеді, дата-орталықтар мен кәсіпорындарға арналған, басқару консолі қажет.","2-тип (hosted): негізгі ОЖ үстінде жұмыс істейді (мысалы, Mac ноутбугындағы Windows ВМ), басқару консолі қажет емес."]],["Бұлттық есептеулер",["Деректер мен қолданбаларға кез келген жерде, кез келген уақытта, кез келген құрылғыдан Интернет арқылы қол жеткізу.","Сұраныс бойынша: тек пайдаланғаныңа төлейсің, қуатты арттыруға және азайтуға болады, өз серверіңді сатып алу керек емес.","Бұлт қолданбаны жабдықтан бөледі; виртуализация ОЖ-ді жабдықтан бөледі.","Бұл бір нәрсе ЕМЕС: виртуализация — бұлттар құрылатын технология."]],["Қызмет модельдері",["SaaS: дайын бағдарлама, техникалық қызмет көрсетуді қажет етпейді (техникалық білім болмаса ең жақсы таңдау).","PaaS: әзірлеу платформасы мен құралдары, мысалы әлемдегі әзірлеушілердің ортақ ортасы.","IaaS: виртуалды серверлер, сақтау орны және желілер. ITaaS: қызмет ретіндегі АТ."]],["Бұлт түрлері",["Жария (public): жалпы көпшілікке.","Жеке (private): бір ұйымға, мысалы мемлекетке.","Қауымдастық (community): ортақ нақты қажеттілікке (мысалы, халықаралық қауымдастық).","Гибридті: бір архитектурамен қосылған екі немесе одан көп бұлт."]],["Байланысты технологиялар",["SDN (бағдарламалық анықталатын желі): желі топологиясын автоматты және жылдам өзгертеді.","VDI (виртуалды жұмыс үстелі инфрақұрылымы): қашықтағы оқушыларға біркелкі практикалық орта.","Қолданбаларды ағынмен беру және Office 365 сияқты шешімдер қолданбаларды бұлттан жеткізеді."]]]};
const Q=[
["What technology allows users to access data anywhere and at any time?",["cloud computing"],["virtualization","micromarketing","data analytics"]],
["Which two challenges does implementing virtualization in a data center help businesses overcome? (Choose two.)",["physical footprint","power and air conditioning"],["virus and spyware attacks","operating system license requirements","server hardware needs"]],
["What is a difference between the functions of cloud computing and virtualization?",["Cloud computing separates the application from the hardware whereas virtualization separates the OS from the underlying hardware."],["Cloud computing provides services on web-based access whereas virtualization provides services on data access through virtualized Internet connections.","Cloud computing requires hypervisor technology whereas virtualization is a fault tolerance technology.","Cloud computing utilizes data center technology whereas virtualization is not used in data centers."]],
["Which cloud model provides services for a specific organization or entity?",["a private cloud"],["a public cloud","a community cloud","a hybrid cloud"]],
["A small company is considering moving many of its data center functions to the cloud. What are three advantages? (Choose three.)",["The company does not need to be concerned about how to handle increasing data storage and processing demands with in-house data center equipment.","The company only needs to pay for the amount of processing and storage capacity that it uses.","The company can increase processing and storage capacity as needed and then decrease capacity when it is no longer needed."],["Cloud services are billed at a fixed fee no matter how much processing and storage are used by the company.","Cloud services enable the company to own and administer its own servers and storage devices.","Single-tenant data centers can easily grow to accommodate increasing data storage requirements."]],
["Which is a characteristic of a Type 2 hypervisor?",["does not require management console software"],["installs directly on hardware","best suited for enterprise environments","has direct access to server hardware resources"]],
["A technician needs to use an application that is not supported by Windows on the PC. How can the technician make it run?",["Create a virtual machine with an operating system that supports the application."],["Install the application with elevated permissions as administrator.","Use the Windows Compatibility mode.","Install the application in safe mode."]],
["Which technology automatically and rapidly re-configures network topologies to achieve flexible and responsive networks?",["software-defined networking"],["hosted hypervisor","infrastructure as a service","hybrid cloud computing"]],
["A training company wants to give remote learners a uniform, hands-on Windows practice environment. Which cloud-based solution helps?",["virtual desktop infrastructure"],["Google Drive","Office 365","virtual application stream"]],
["A small college wishes to deploy a learning management system (LMS) and is looking for a hosted solution. Which solution helps?",["Office 365"],["Virtual application stream","Dropbox","Virtual desktop infrastructure"]],
["Which cloud type? Built to meet a specific need.",["Community cloud"],["Public cloud","Private cloud","Hybrid cloud"]],
["Which cloud type? Services made available to the general population.",["Public cloud"],["Community cloud","Private cloud","Hybrid cloud"]],
["Which cloud type? Intended for a specific organization or entity, such as the government.",["Private cloud"],["Community cloud","Public cloud","Hybrid cloud"]],
["Which cloud type? Made up of two or more clouds connected via a single architecture.",["Hybrid cloud"],["Community cloud","Public cloud","Private cloud"]],
["Which statement describes a characteristic of cloud computing?",["Applications can be accessed over the Internet by individual users or businesses using any device, anywhere in the world."],["Investment in new infrastructure is required in order to access the cloud.","Devices can connect to the Internet through existing electrical wiring.","A business can connect directly to the Internet without the use of an ISP."]],
["Which type of hypervisor is implemented when a user with a laptop running Mac OS installs a Windows virtual OS instance?",["type 2"],["bare metal","virtual machine","type 1"]],
["Which type of hypervisor would most likely be used in a data center?",["Type 1"],["Type 2","Hadoop","Nexus"]],
["An international civil engineering association wants a cloud-based service for collaboration among members in multiple divisions. Which cloud model is suitable?",["community"],["private","public","hybrid"]],
["What is the main function of a hypervisor?",["It is used to create and manage multiple VM instances on a host machine."],["It is a device that filters and checks security credentials.","It is a device that synchronizes a group of sensors.","It is used by ISPs to monitor cloud computing resources.","It is software used to coordinate and prepare data for analysis."]],
["What is an advantage of running virus and worm lab exercises in a virtualized environment instead of on actual PCs?",["Virus and worm attacks are more easily controlled in a virtualized environment, thus helping to protect the college network and its devices from attack."],["The viruses and worms will have limited functionality inside the virtualized environment.","The lab exercises are performed faster inside of the virtualized environment.","The virtualization environment has better tools to develop mitigation solutions."]],
["Which cloud computing service is best for an organization that does not have the technical knowledge to host and maintain applications at its local site?",["SaaS"],["PaaS","IaaS","ITaaS"]],
["True or False. Cloud computing and virtualization are different terms that refer to the same thing.",["false"],["true"]],
["Developers in different cities use a cloud-based development environment to access the same software development tools. Which cloud service is used?",["PaaS"],["SaaS","ITaaS","IaaS"]],
["How does virtualization help with disaster recovery within a data center?",["support of live migration"],["improvement of business practices","supply of consistent air flow","guarantee of power"]],
["While a technician is installing a printer, the technician hears a loud clicking noise. Which device should the technician check first?",["Hard drive"],["Motherboard","RAM"]]];
const P=[["Public cloud","Services for the general population"],["Private cloud","One specific organization or entity"],["Community cloud","Built to meet a specific shared need"],["Hybrid cloud","Two or more clouds, single architecture"],["SaaS","Ready-to-use app, no maintenance"],["PaaS","Shared development environment"],["IaaS","Virtual servers, storage, networks"],["Type 1","Bare metal, data centers"],["Type 2","Runs on a host OS, no console"],["SDN","Auto re-configures network topology"],["VDI","Uniform virtual desktops for learners"],["Live migration","Helps disaster recovery"]];
const sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s),A=$("#A"),all=Q.map((_,i)=>i);
let lang="en",page="theory",wrong=new Set(),tmr;
const t=k=>UI[lang][k];
const PG=[["theory","📘"],["cards","🃏"],["test","📝"],["match","🧩"],["blitz","⚡"],["mist","🔁"]];
function setL(l){lang=l;document.documentElement.lang=l;go(page)}
function go(p){page=p;clearInterval(tmr);$("#ti").textContent=t("ti");$("#su").textContent=t("su");
$("#nv").innerHTML=PG.map(([k,e])=>`<button class="${k==p?"on":""}" onclick="go('${k}')">${e} ${t(k)}</button>`).join("");
({theory,cards:()=>cards(1),test:()=>runTest(all),match,blitz,mist})[p]()}
function theory(){A.innerHTML=`<p class=mu>${t("note")}</p>`+TH[lang].map(s=>`<div class=card><h3>${s[0]}</h3><ul>${s[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}
let deck,kn;
function cards(s){if(s){deck=sh(all);kn=0;fl=false}
if(!deck.length){A.innerHTML=`<div class=card><div class=big>🎉</div><h3>${t("done")}</h3><button class=pri onclick="cards(1)">${t("restart")}</button></div>`;return}
const q=Q[deck[0]];
A.innerHTML=`<p class=mu>${t("left")}: ${deck.length} · ✔ ${kn} · ${t("hint")}</p><div class="fc ${fl?"f":""}" onclick="fl=!fl;cards()">${fl?q[1].map(x=>"✔ "+x).join("<br><br>"):q[0]}</div><div class=row><button onclick="deck.push(deck.shift());fl=false;cards()">↻ ${t("again")}</button><button class=pri onclick="deck.shift();kn++;fl=false;cards()">✔ ${t("know")}</button></div>`}
let fl=false,tq,ti,ts,sel,ans,op;
function runTest(l){tq=sh(l);ti=0;ts=0;testQ()}
function testQ(){if(ti>=tq.length){const p=Math.round(ts/tq.length*100);A.innerHTML=`<div class=card><div class=big>${p>=80?"🏆":p>=50?"👍":"💪"}</div><h3>${t("res")}: ${ts}/${tq.length} (${p}%)</h3><div class=row><button class=pri onclick="go('test')">${t("restart")}</button><button onclick="go('mist')">${t("retry")} (${wrong.size})</button></div></div>`;return}
const q=Q[tq[ti]];ans=false;sel=[];op=sh([...q[1].map(x=>[x,1]),...q[2].map(x=>[x,0])]);const m=q[1].length>1;
A.innerHTML=`<div class=bar><i style="width:${ti/tq.length*100}%"></i></div><div class=card><p class=mu>${t("q")} ${ti+1}/${tq.length}${m?" · "+t("choose"):""}</p><h3>${q[0]}</h3>${op.map((o,k)=>`<button class=op id=o${k} onclick="pick(${k})">${o[0]}</button>`).join("")}<div class=row id=ac>${m?`<button class=pri onclick="grade()">${t("check")}</button>`:""}</div></div>`}
function pick(k){if(ans)return;if(Q[tq[ti]][1].length==1){sel=[k];grade();return}
sel=sel.includes(k)?sel.filter(x=>x!=k):[...sel,k];$("#o"+k).classList.toggle("sel")}
function grade(){ans=true;const ok=op.every((o,k)=>!!o[1]==sel.includes(k));
op.forEach((o,k)=>$("#o"+k).classList.add(o[1]?"ok":sel.includes(k)?"bad":"x"));
if(ok){ts++;wrong.delete(tq[ti])}else wrong.add(tq[ti]);
$("#ac").innerHTML=`<button class=pri onclick="ti++;testQ()">${t("next")} →</button>`}
function mist(){wrong.size?runTest([...wrong]):A.innerHTML=`<div class=card><div class=big>✨</div><p>${t("empty")}</p></div>`}
let bs,bl,bt;
function blitz(){bs=0;bl=60;tmr=setInterval(()=>{bl--;const e=$("#tm");if(e)e.textContent=bl;if(bl<=0){clearInterval(tmr);A.innerHTML=`<div class=card><div class=big>⚡</div><h3>${t("res")}: ${bs}</h3><button class=pri onclick="go('blitz')">${t("go")}</button></div>`}},1000);nb()}
function nb(){const i=Math.random()*Q.length|0,q=Q[i],tr=Math.random()<.5,pool=tr?q[1]:q[2];bt={tr,a:pool[Math.random()*pool.length|0],q:q[0]};
A.innerHTML=`<p class=mu>${t("blz")} · ${t("time")}: <b id=tm>${bl}</b> · ✔ ${bs}</p><div class=card><h3>${bt.q}</h3><p>→ ${bt.a}</p><div class=row><button class=pri onclick="bj(true)">${t("tr")}</button><button onclick="bj(false)">${t("fl")}</button></div></div>`}
function bj(v){if(bl<=0)return;bs+=v==bt.tr?1:-1;if(bs<0)bs=0;nb()}
let mp,ml,mr,ms,md,me;
function match(){mp=sh(P).slice(0,6);ml=sh([0,1,2,3,4,5]);mr=sh([0,1,2,3,4,5]);ms=null;md=new Set;me=0;dm()}
function dm(){const w=md.size==6;A.innerHTML=`<p class=mu>${t("pairs")} · ${t("err")}: ${me}</p><div class=cols><div>${ml.map(i=>`<button ${md.has(i)?"class=op ok disabled":""} style="${ms===i?"border-color:var(--ac);border-width:2px":""}" onclick="ml1(${i})">${mp[i][0]}</button>`).join("")}</div><div>${mr.map(i=>`<button ${md.has(i)?"class=ok disabled style=background:var(--ok);color:#fff":""} onclick="mr1(${i})">${mp[i][1]}</button>`).join("")}</div></div>${w?`<div class=card><div class=big>🎉</div><button class=pri onclick="match()">${t("restart")}</button></div>`:""}`}
function ml1(i){ms=i;dm()}
function mr1(i){if(ms===null)return;if(ms===i)md.add(i);else me++;ms=null;dm()}
go("theory");
</script></body></html>
